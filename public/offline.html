<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7137d8" />
    <title>EchoNotes is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111018; color: #f7f5fb; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 420px; }
      img { width: 82px; height: 82px; object-fit: contain; }
      h1 { margin: 18px 0 8px; font-size: 24px; }
      p { margin: 0; color: #aaa4b5; line-height: 1.6; }
      button { margin-top: 22px; border: 0; border-radius: 10px; padding: 11px 18px; background: #7137d8; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/echo8v-logo.png" alt="EchoNotes" />
      <h1>EchoNotes is offline</h1>
      <p>The app could not finish saving its offline files. Connect once, reopen EchoNotes and wait for the offline-ready message.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
